<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12192a; --ink-2:#1a2338; --ink-3:#212c46;
    --parchment:#ece5d3; --parchment-dim:#b9b3a2;
    --brass:#c9a04d; --brass-dim:#8a713a; --teal:#5c8b85; --rose:#a8543f;
    --rule:rgba(236,229,211,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(92,139,133,0.08), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(168,84,63,0.07), transparent 55%),
      var(--ink);
    color:var(--parchment); font-family:'Inter',sans-serif; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--brass);color:var(--ink);}
  .wrap{max-width:1240px;margin:0 auto;padding:0 28px 80px;}

  header{padding:64px 28px 40px;text-align:center;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--brass);display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(92,139,133,.18);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(2.6rem,6vw,4.6rem);letter-spacing:-0.01em;line-height:1;}
  h1 em{font-style:italic;font-weight:500;color:var(--brass);}
  .subline{margin-top:18px;color:var(--parchment-dim);font-size:16px;max-width:560px;margin-left:auto;margin-right:auto;line-height:1.6;}
  .rule{max-width:640px;margin:36px auto 0;height:1px;background:linear-gradient(90deg,transparent,var(--rule) 20%,var(--rule) 80%,transparent);}
  .rule-mark{width:6px;height:6px;background:var(--brass);transform:rotate(45deg);margin:-3.5px auto 0;}

  .controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:28px 0 10px;border-bottom:1px solid var(--rule);margin-bottom:14px;}
  .search-box{position:relative;flex:1;min-width:260px;}
  .search-box input{
    width:100%;background:transparent;border:none;border-bottom:1px solid var(--rule);
    padding:10px 4px 10px 26px;color:var(--parchment);font-family:'Inter',sans-serif;font-size:15px;
  }
  .search-box input::placeholder{color:var(--parchment-dim);}
  .search-box input:focus{outline:none;border-bottom-color:var(--brass);}
  .search-box::before{content:"⌕";position:absolute;left:0;top:8px;color:var(--brass-dim);font-size:16px;}
  .search-hint{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--parchment-dim);padding:6px 2px 22px;}
  .search-hint b{color:var(--teal);}

  .status-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:24px;font-family:'JetBrains Mono',monospace;font-size:12px;}
  .status-pill{border:1px solid var(--rule);padding:6px 16px;border-radius:20px;color:var(--parchment-dim);}
  .status-pill.live{border-color:var(--teal);color:var(--teal);}
  .status-pill.error{border-color:var(--rose);color:var(--rose);}
  .refresh{background:none;border:1px solid var(--brass-dim);color:var(--brass);padding:6px 16px;border-radius:20px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;}
  .refresh:hover{background:var(--brass);color:var(--ink);}

  .field-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
  .field-tab{
    font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
    background:transparent;border:1px solid var(--rule);color:var(--parchment-dim);
    padding:8px 16px;border-radius:20px;cursor:pointer;transition:all .2s;
  }
  .field-tab:hover{border-color:var(--brass-dim);color:var(--parchment);}
  .field-tab.active{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:600;}

  .source-note{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--parchment-dim);
    margin-bottom:30px;padding:10px 14px;border:1px dashed var(--rule);border-radius:2px;
  }
  .source-note code{color:var(--brass);}

  .loading{display:none;text-align:center;padding:70px 20px;font-family:'Fraunces',serif;font-style:italic;color:var(--parchment-dim);font-size:1.2rem;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);}
  .card{background:var(--ink);padding:26px 24px 24px;cursor:pointer;transition:background .25s;display:flex;flex-direction:column;gap:14px;}
  .card:hover{background:var(--ink-2);}
  .card:hover .card-name{color:var(--brass);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .entry-no{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--brass-dim);letter-spacing:.05em;white-space:nowrap;}
  .rating-mark{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--brass);white-space:nowrap;letter-spacing:1px;}
  .portrait{width:100%;aspect-ratio:4/5;overflow:hidden;border:1px solid var(--rule);background:var(--ink-3);display:flex;align-items:center;justify-content:center;}
  .portrait img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(15%) contrast(1.02);transition:transform .4s ease;}
  .card:hover .portrait img{transform:scale(1.05);}
  .portrait .no-photo{font-family:'Fraunces',serif;font-style:italic;color:var(--parchment-dim);font-size:13px;}
  .card-name{font-family:'Fraunces',serif;font-weight:600;font-size:1.3rem;line-height:1.18;transition:color .2s;}
  .card-field{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);}
  .card-note{font-size:13px;color:var(--parchment-dim);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .card-foot{
    display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;
    border-top:1px solid var(--rule);font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--parchment-dim);
  }
  .source-mark{color:var(--brass);}

  .empty-state{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--parchment-dim);font-family:'Fraunces',serif;font-style:italic;font-size:1.15rem;}
  .empty-state .sub{font-family:'Inter',sans-serif;font-style:normal;font-size:13px;margin-top:10px;color:var(--brass-dim);}

  .card-skel{background:var(--ink);padding:26px 24px 24px;display:flex;flex-direction:column;gap:14px;}
  .skel-block{background:var(--ink-3);border-radius:2px;animation:shimmer 1.4s infinite ease-in-out;}
  @keyframes shimmer{0%,100%{opacity:.5;}50%{opacity:1;}}
  .skel-img{width:100%;aspect-ratio:4/5;}
  .skel-line{height:14px;width:70%;}
  .skel-line.short{width:40%;height:10px;}

  .detail-view{display:none;}
  .detail-view.active{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .back-btn{
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
    background:none;border:none;color:var(--brass);cursor:pointer;display:flex;align-items:center;gap:8px;margin:38px 0 30px;
  }
  .back-btn:hover{color:var(--parchment);}

  .detail-header{display:grid;grid-template-columns:300px 1fr;gap:44px;padding-bottom:40px;border-bottom:1px solid var(--rule);margin-bottom:36px;}
  .detail-image{aspect-ratio:4/5;overflow:hidden;border:1px solid var(--rule);position:relative;background:var(--ink-3);display:flex;align-items:center;justify-content:center;}
  .detail-image img{width:100%;height:100%;object-fit:cover;filter:grayscale(15%) contrast(1.02);}
  .detail-name{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(2rem,4vw,3rem);line-height:1.05;}
  .detail-title{font-family:'JetBrains Mono',monospace;color:var(--teal);letter-spacing:.06em;text-transform:uppercase;font-size:13px;margin-top:10px;}
  .detail-rating{margin-top:16px;color:var(--brass);font-size:1.1rem;letter-spacing:2px;}

  .stats-bar{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:26px;}
  .stat{flex:1;background:var(--ink-2);padding:18px 20px;text-align:center;}
  .stat-value{font-family:'JetBrains Mono',monospace;font-size:1.4rem;color:var(--brass);font-weight:600;}
  .stat-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--parchment-dim);margin-top:4px;}

  .detail-section{margin-bottom:36px;}
  .section-title{
    font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--brass-dim);margin-bottom:16px;display:flex;align-items:center;gap:10px;
  }
  .section-title::after{content:"";flex:1;height:1px;background:var(--rule);}
  .about-text{color:var(--parchment-dim);line-height:1.75;font-size:15px;max-width:62ch;}
  .wiki-link{
    display:inline-flex;align-items:center;gap:8px;margin-top:16px;color:var(--brass);
    font-family:'JetBrains Mono',monospace;font-size:12.5px;text-decoration:none;border-bottom:1px solid var(--brass-dim);padding-bottom:2px;
  }
  .wiki-link:hover{color:var(--parchment);}

  @media (max-width:680px){
    .detail-header{grid-template-columns:1fr;}
    .detail-image{max-width:260px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow"><span class="dot"></span>Live · Multi-source</div>
    <h1>Star <em>Directory</em></h1>
    <p class="subline">Pulls real people, photos, and stats from any public API you plug in, then ranks and rates them automatically.</p>
    <div class="rule"></div>
    <div class="rule-mark"></div>
    <div class="status-row">
      <span class="status-pill live" id="connectionStatus">● Connecting…</span>
      <span class="status-pill" id="lastUpdate">Last update: never</span>
      <button class="refresh" onclick="init()">↻ Refresh</button>
    </div>
  </header>

  <div id="mainView">
    <div class="controls">
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="Search everything loaded so far…" oninput="applySearch()">
      </div>
    </div>
    <div class="search-hint">Add more APIs by editing <b>DATA_SOURCES</b> at the top of the script — see comments in the code.</div>

    <div class="field-tabs" id="categoryTabs"></div>
    <div class="source-note" id="sourceNote"></div>

    <div class="loading" id="loading">Loading…</div>
    <div class="grid" id="starsGrid"></div>
  </div>

  <div class="detail-view" id="detailView">
    <button class="back-btn" onclick="showMainView()">← Back to directory</button>
    <div id="detailContent"></div>
  </div>

</div>

<script>
/* =====================================================================
   HOW TO ADD YOUR OWN API
   ---------------------------------------------------------------------
   Add an object to DATA_SOURCES below. The app will:
     1. fetch(url)
     2. find the list of people inside the response using `arrayPath`
     3. read each person's fields using the dot-paths you give it
     4. rank everyone from that source against each other using
        `statField`, and turn that into a 1–5 star rating automatically

   FIELD PATHS use simple dot notation into each item's JSON, e.g.
   "profile.name" or "images.0.url". Leave a field blank/null to skip it.

   If a field should just be a fixed label instead of pulled from the
   API (e.g. every item in this source is an "Athlete"), prefix the
   value with "$" — e.g. category: "$Athletes".

   Only APIs that allow cross-origin browser requests (CORS) will work,
   since this page has no backend. Most public "open" APIs do. If one
   doesn't, you'll see a clear error for that source instead of a hang.
   ===================================================================== */

const DATA_SOURCES = [
  {
    id: "wikipedia",
    label: "Wikipedia",
    type: "wikipedia-builtin",   // built-in handler, see below — always on
    seed: [
      { title: "Zendaya",           category: "Actors" },
      { title: "Timothée Chalamet", category: "Actors" },
      { title: "Pedro Pascal",      category: "Actors" },
      { title: "Taylor Swift",      category: "Musicians" },
      { title: "Billie Eilish",     category: "Musicians" },
      { title: "Simone Biles",      category: "Athletes" }
    ]
  }

  // --- EXAMPLE: paste in a real API and uncomment to add it ------------
  // {
  //   id: "myApi",
  //   label: "My API",
  //   type: "generic",
  //   url: "https://api.example.com/people",
  //   arrayPath: "results",         // "" if the response is already an array
  //   fields: {
  //     id:          "id",
  //     name:        "name",
  //     category:    "$Custom",     // "$" = fixed label, not a field
  //     description: "role",
  //     note:        "bio",
  //     photo:       "photoUrl",
  //     statField:   "popularity",  // numeric field used to rank + rate
  //     sourceUrl:   "profileUrl"
  //   }
  // }
];

let allStars = [];
let currentCategory = '';

// ---- generic helpers --------------------------------------------------

function getByPath(obj, path){
  if(!path) return undefined;
  return path.split('.').reduce((v,key)=> (v==null ? undefined : v[key]), obj);
}
function resolveField(item, spec){
  if(spec == null) return null;
  if(typeof spec === 'string' && spec.startsWith('$')) return spec.slice(1);
  return getByPath(item, spec);
}
function formatNumber(n){
  if(n==null || isNaN(n)) return '—';
  if(n>=1000000) return (n/1000000).toFixed(1)+'M';
  if(n>=1000) return (n/1000).toFixed(1)+'K';
  return n.toString();
}
async function fetchWithTimeout(url, ms=6000){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try{
    const res = await fetch(url, { signal: controller.signal });
    if(!res.ok) throw new Error(`status ${res.status}`);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

// Percentile-rank everyone within their own source (since different
// APIs use wildly different scales) and turn that into 1-5 stars.
function assignRatings(entries){
  const bySource = {};
  entries.forEach(e => {
    if(!bySource[e.sourceId]) bySource[e.sourceId] = [];
    if(typeof e.statValue === 'number') bySource[e.sourceId].push(e);
  });
  Object.values(bySource).forEach(group => {
    const sorted = [...group].sort((a,b)=>a.statValue-b.statValue);
    sorted.forEach((e, i) => {
      const pct = sorted.length > 1 ? i/(sorted.length-1) : 1;
      e.rating = Math.max(1, Math.min(5, Math.round(1 + pct*4)));
    });
  });
  entries.forEach(e => { if(e.rating == null) e.rating = 3; }); // no stat → neutral
}

function stars(rating){
  const full = Math.max(0, Math.min(5, Math.round(rating||0)));
  return '★'.repeat(full) + '☆'.repeat(5-full);
}

// ---- built-in Wikipedia handler ---------------------------------------

const WIKI_SUMMARY = title => `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
const WIKI_PAGEVIEWS = title => {
  const end = new Date(); end.setDate(end.getDate()-2);
  const start = new Date(end); start.setDate(start.getDate()-30);
  const fmt = d => d.toISOString().slice(0,10).replace(/-/g,'');
  return `https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/en.wikipedia/all-access/all-agents/${encodeURIComponent(title)}/daily/${fmt(start)}/${fmt(end)}`;
};

async function loadWikipediaSource(source){
  const results = await Promise.all(source.seed.map(async s => {
    try{
      const summary = await fetchWithTimeout(WIKI_SUMMARY(s.title));
      if(summary.type === 'disambiguation') return null;
      let views = null;
      try{
        const pv = await fetchWithTimeout(WIKI_PAGEVIEWS(summary.title));
        views = (pv.items||[]).reduce((sum,i)=>sum+i.views,0);
      }catch(e){}
      return {
        sourceId: source.id, sourceLabel: source.label,
        id: `wiki-${summary.pageid}`,
        name: summary.title,
        category: s.category || 'Notable',
        description: summary.description || '',
        note: summary.extract || 'No summary available.',
        photo: summary.thumbnail ? summary.thumbnail.source : null,
        sourceUrl: summary.content_urls?.desktop?.page || `https://en.wikipedia.org/wiki/${encodeURIComponent(summary.title)}`,
        statValue: views
      };
    }catch(e){
      console.warn(`Wikipedia: could not load "${s.title}"`, e.message);
      return null;
    }
  }));
  return { entries: results.filter(Boolean), errors: results.length - results.filter(Boolean).length };
}

// ---- generic pluggable API handler -------------------------------------

async function loadGenericSource(source){
  try{
    const raw = await fetchWithTimeout(source.url);
    const list = source.arrayPath ? getByPath(raw, source.arrayPath) : raw;
    if(!Array.isArray(list)) throw new Error(`arrayPath "${source.arrayPath}" did not resolve to a list`);

    const entries = list.map((item, i) => {
      const f = source.fields || {};
      const statRaw = resolveField(item, f.statField);
      return {
        sourceId: source.id, sourceLabel: source.label,
        id: `${source.id}-${resolveField(item, f.id) ?? i}`,
        name: resolveField(item, f.name) || 'Unnamed',
        category: resolveField(item, f.category) || source.label,
        description: resolveField(item, f.description) || '',
        note: resolveField(item, f.note) || '',
        photo: resolveField(item, f.photo) || null,
        sourceUrl: resolveField(item, f.sourceUrl) || null,
        statValue: typeof statRaw === 'number' ? statRaw : (statRaw != null ? Number(statRaw) : null)
      };
    }).filter(e => e.name);

    return { entries, errors: 0 };
  }catch(e){
    console.error(`Source "${source.label}" failed:`, e.message);
    return { entries: [], errors: 1, errorMessage: e.message };
  }
}

// ---- orchestration ------------------------------------------------------

function skeletonGrid(count){
  document.getElementById('starsGrid').innerHTML = Array.from({length:count}).map(()=>`
    <div class="card-skel">
      <div class="skel-block skel-img"></div>
      <div class="skel-block skel-line"></div>
      <div class="skel-block skel-line short"></div>
    </div>
  `).join('');
}

async function init(){
  document.getElementById('searchInput').value = '';
  currentCategory = '';
  const statusEl = document.getElementById('connectionStatus');
  statusEl.textContent = '● Connecting…';
  statusEl.className = 'status-pill live';
  document.getElementById('starsGrid').style.display = 'grid';
  skeletonGrid(6);

  const outcomes = await Promise.all(DATA_SOURCES.map(source =>
    source.type === 'wikipedia-builtin' ? loadWikipediaSource(source) : loadGenericSource(source)
  ));

  allStars = outcomes.flatMap(o => o.entries);
  assignRatings(allStars);

  const failedSources = DATA_SOURCES.filter((s,i) => outcomes[i].entries.length === 0 && outcomes[i].errors > 0);

  if(allStars.length === 0){
    statusEl.textContent = '● No sources reachable';
    statusEl.className = 'status-pill error';
    document.getElementById('starsGrid').innerHTML =
      `<div class="empty-state">Couldn't load anyone.<div class="sub">Check DATA_SOURCES at the top of the script for typos in the URL or field paths.</div></div>`;
    return;
  }

  statusEl.textContent = `● Connected · ${allStars.length} loaded from ${DATA_SOURCES.length - failedSources.length}/${DATA_SOURCES.length} sources`;
  statusEl.className = failedSources.length ? 'status-pill error' : 'status-pill live';
  document.getElementById('lastUpdate').textContent = 'Last update: ' + new Date().toLocaleTimeString();

  document.getElementById('sourceNote').style.display = failedSources.length ? 'block' : 'none';
  if(failedSources.length){
    document.getElementById('sourceNote').innerHTML =
      `⚠ Could not reach: ${failedSources.map(s=>`<code>${s.label}</code>`).join(', ')} — check its URL/CORS support.`;
  }

  buildCategoryTabs();
  renderGrid(allStars);
}

function buildCategoryTabs(){
  const categories = [...new Set(allStars.map(s=>s.category))];
  document.getElementById('categoryTabs').innerHTML =
    `<button class="field-tab active" onclick="filterCategory('')">All</button>` +
    categories.map(c=>`<button class="field-tab" onclick="filterCategory('${c}')">${c}</button>`).join('');
}

function filterCategory(category){
  currentCategory = category;
  document.querySelectorAll('.field-tab').forEach(tab=>{
    tab.classList.toggle('active', (category==='' && tab.textContent==='All') || tab.textContent===category);
  });
  applySearch();
}

function applySearch(){
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let list = currentCategory ? allStars.filter(s=>s.category===currentCategory) : allStars;
  if(q) list = list.filter(s => s.name.toLowerCase().includes(q) || s.description.toLowerCase().includes(q));
  renderGrid(list);
}

function renderGrid(list){
  const grid = document.getElementById('starsGrid');
  if(!list.length){
    grid.innerHTML = `<div class="empty-state">Nothing matches.<div class="sub">Try clearing the search or a different category.</div></div>`;
    window.__currentList = [];
    return;
  }
  const sorted = [...list].sort((a,b)=> b.rating - a.rating || (b.statValue||0) - (a.statValue||0));
  grid.innerHTML = sorted.map((s,i) => `
    <div class="card" onclick='showDetail("${s.id}")'>
      <div class="card-top">
        <span class="entry-no">No. ${String(i+1).padStart(3,'0')}</span>
        <span class="rating-mark">${stars(s.rating)}</span>
      </div>
      <div class="portrait">
        ${s.photo ? `<img src="${s.photo}" alt="${s.name}" loading="lazy" onerror="this.parentElement.innerHTML='<span class=\\'no-photo\\'>No photo</span>'">` : `<span class="no-photo">No photo on file</span>`}
      </div>
      <div class="card-name">${s.name}</div>
      <div class="card-field">${s.category}${s.description ? ' · ' + s.description : ''}</div>
      <div class="card-note">${s.note}</div>
      <div class="card-foot">
        <span class="source-mark">${s.sourceLabel}</span>
        <span>${formatNumber(s.statValue)}</span>
      </div>
    </div>
  `).join('');
  window.__currentList = sorted;
}

function showDetail(id){
  const s = (window.__currentList || allStars).find(x => x.id === id);
  if(!s) return;

  document.getElementById('mainView').style.display = 'none';
  document.getElementById('detailView').classList.add('active');

  document.getElementById('detailContent').innerHTML = `
    <div class="detail-header">
      <div class="detail-image">
        ${s.photo ? `<img src="${s.photo}" alt="${s.name}">` : `<span class="no-photo">No photo on file</span>`}
      </div>
      <div>
        <div class="detail-name">${s.name}</div>
        <div class="detail-title">${s.category}${s.description ? ' · ' + s.description : ''}</div>
        <div class="detail-rating">${stars(s.rating)} (${s.rating}/5)</div>
        <div class="stats-bar">
          <div class="stat"><div class="stat-value">${formatNumber(s.statValue)}</div><div class="stat-label">Ranking stat</div></div>
          <div class="stat"><div class="stat-value">${s.sourceLabel}</div><div class="stat-label">Source</div></div>
        </div>
        ${s.sourceUrl ? `<a class="wiki-link" href="${s.sourceUrl}" target="_blank" rel="noopener">View original source →</a>` : ''}
      </div>
    </div>
    <div class="detail-section">
      <div class="section-title">About</div>
      <p class="about-text">${s.note || 'No further details provided by the source.'}</p>
    </div>
  `;
}

function showMainView(){
  document.getElementById('mainView').style.display = 'block';
  document.getElementById('detailView').classList.remove('active');
}

init();
</script>
</body>
</html>
